<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#050716" />
  <title>Galalaxy</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23050716'/><polygon points='16,4 20,24 16,20 12,24' fill='%2358e6ff'/></svg>">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050716;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #050716;
    }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 18%, rgba(56, 140, 255, 0.08), transparent 35%),
        linear-gradient(to bottom, rgba(255,255,255,0.035), transparent 20%, rgba(0,0,0,0.22));
      mix-blend-mode: screen;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
